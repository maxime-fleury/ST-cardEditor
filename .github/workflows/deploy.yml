# 🚀 Deploy stable and development builds to GitHub Pages
#
# master → https://maxime-fleury.github.io/ST-cardEditor/
# dev    → https://maxime-fleury.github.io/ST-cardEditor/dev/
#
# Every deployment publishes both trees in one atomic gh-pages update. The
# default URL is always built from master, so a broken dev build cannot hide
# the last stable version. In Repository Settings > Pages, select gh-pages / root.

name: Deploy to GitHub Pages

on:
  push:
    branches: [ "master", "dev" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch stable and development source branches
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin master
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            git fetch --no-tags --depth=1 origin dev
          else
            git fetch --no-tags --depth=1 origin dev || true
          fi

      - name: Prepare complete static site
        run: |
          set -euo pipefail
          rm -rf deploy source-master source-dev
          mkdir -p deploy source-master

          git archive origin/master | tar -x -C source-master
          mkdir -p deploy/js
          cp -r source-master/public/* deploy/
          cp -r source-master/js/* deploy/js/
          cp source-master/.nojekyll deploy/

          if git rev-parse --verify origin/dev >/dev/null 2>&1; then
            mkdir -p source-dev deploy/dev/js
            git archive origin/dev | tar -x -C source-dev
            cp -r source-dev/public/* deploy/dev/
            cp -r source-dev/js/* deploy/dev/js/
            cp source-dev/.nojekyll deploy/dev/
          fi

          test -f deploy/index.html
          if git rev-parse --verify origin/dev >/dev/null 2>&1; then
            test -f deploy/dev/index.html
          fi

          echo "=== Deploy contents ==="
          find deploy -type f | sort

      - name: Deploy stable + dev trees to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
