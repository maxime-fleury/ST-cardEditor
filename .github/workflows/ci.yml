# 🧪 CI — unit suite + bundle-freshness gate
#
# Fast, PR-visible feedback independent of the deploy pipeline (deploy.yml also
# runs these inside its `check` job, but this workflow surfaces them on every
# push/PR without tying the result to a deployment). Runs the unit suite under a
# coverage floor, the typecheck/lint/i18n gates, and the asset + vendor drift
# guards, which include the bundle-freshness diff of js/app.js against a fresh
# `bun run build`.

# The end-to-end Playwright suite runs in deploy.yml, which is also wired to
# pull_request — the two workflows are deliberately split so PRs get both
# signals without duplicating a browser install here.

name: CI

on:
  push:
    branches: ["master", "dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  unit-and-freshness:
    name: Unit tests + bundle freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pin the exact runtime that produced the committed js/app.js bundle
          # (see .bun-version): bun's bundler output is only byte-stable for
          # the same version, and check-assets diffs a fresh build against the
          # committed artifact.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (tests/unit — every hand-written module under js/)
        run: bun run test:unit

      # "N tests pass" says nothing about what they touch, so the suite is run a
      # second time under coverage with a global ratchet plus per-module floors
      # for the pure-logic modules (see scripts/check-coverage.mjs).
      - name: Unit coverage floors
        run: bun run test:coverage

      - name: Typecheck (@ts-check on every hand-written module under js/)
        run: bun run typecheck

      - name: Lint (ESLint flat config — style + static bugs)
        run: bun run lint

      # Every new UI string must reach all 27 locales (a missing key renders as
      # the raw key to the user), and the coverage floor catches a locale
      # drifting back toward the English fallback.
      - name: i18n key parity + coverage
        run: bun run i18n:check

      - name: No locale is missing an en.js key
        run: bun scripts/i18n-add.mjs --check

      - name: Asset / SW-shell / version drift + bundle freshness check
        run: bun scripts/check-assets.mjs

      # The vendored bytes are what the browser executes, so the manifest hash is
      # the provenance record; nothing else in CI ever re-read it.
      - name: Vendored assets match public/vendor/MANIFEST.txt
        run: bun run vendor:check
